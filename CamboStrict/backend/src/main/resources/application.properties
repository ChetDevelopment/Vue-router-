server.port=3001

# MySQL Database
spring.datasource.url=jdbc:mariadb://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:toklok}?useSSL=false&serverTimezone=UTC&characterEncoding=utf8mb4
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# File uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=${UPLOAD_DIR:./uploads}

# JWT (MUST be set via environment variable in production)
app.jwt.secret=${JWT_SECRET:dev_jwt_secret_key_at_least_32_chars_long_for_dev}
app.jwt.expiration=${JWT_EXPIRATION:900000}

app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

spring.main.banner-mode=off
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
